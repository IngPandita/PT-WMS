server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA: cualquier ruta desconocida devuelve el index y React Router resuelve.
  location / { try_files $uri $uri/ /index.html; }

  # El navegador nunca habla directo con la API: se evita CORS y el origen
  # queda unificado.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
